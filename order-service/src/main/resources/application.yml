spring:
  application:
    name: order-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/orders_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

# Inventory Service URL
inventory:
  service:
    url: http://localhost:8082

# OpenTelemetry Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers
  endpoint:
    health:
      show-details: always
  
  # OpenTelemetry configuration
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        enabled: false  # Disable metrics export (Jaeger only accepts traces)
  
  tracing:
    sampling:
      probability: 1.0  # 100% sampling for demo
    propagation:
      consume: [ "b3", "w3c" ]
      produce: [ "b3", "w3c" ]

# Logging with trace correlation
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    root: INFO
    com.example.order: DEBUG

---
# Docker profile
spring:
  config:
    activate:
      on-profile: docker
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:orders_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

inventory:
  service:
    url: ${INVENTORY_SERVICE_URL:http://inventory-service:8082}

management:
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318}/v1/traces
    metrics:
      export:
        enabled: false
